        function RegionalSelector() {
            const [isNationwide, setIsNationwide] = useState(false);
            const [selectedStates, setSelectedStates] = useState([]);
            const [selectedAcprs, setSelectedAcprs] = useState([]);
            const [selectedSuburbs, setSelectedSuburbs] = useState([]);
            
            const [suburbInput, setSuburbInput] = useState('');
            const [filteredSuburbs, setFilteredSuburbs] = useState([]);

            // New state for ACPR search
            const [acprSearch, setAcprSearch] = useState('');

            // --- Logic: Redundancy Handling ---

            // 1. Add State Logic
            const toggleState = (stateCode) => {
                if (selectedStates.includes(stateCode)) {
                    setSelectedStates(prev => prev.filter(s => s !== stateCode));
                } else {
                    setSelectedStates(prev => [...prev, stateCode]);
                    // Active De-duplication. If State is added, remove its children.
                    setSelectedAcprs(prev => prev.filter(acpr => acpr.state !== stateCode));
                    setSelectedSuburbs(prev => prev.filter(sub => sub.st !== stateCode));
                }
            };

            // 2. Add ACPR Logic
            const toggleAcpr = (acpr) => {
                const isSelected = selectedAcprs.some(a => a.id === acpr.id);
                if (isSelected) {
                    setSelectedAcprs(prev => prev.filter(a => a.id !== acpr.id));
                } else {
                    // If the parent State is already selected, this is redundant. 
                    if (selectedStates.includes(acpr.state)) return; 
                    
                    setSelectedAcprs(prev => [...prev, acpr]);
                }
            };

            // 3. Add Suburb Logic
            const addSuburb = (suburb) => {
                // Check redundancy
                if (selectedStates.includes(suburb.st)) return; 
                // Check duplication
                if (selectedSuburbs.some(s => s.p === suburb.p && s.s === suburb.s)) return;

                setSelectedSuburbs(prev => [...prev, suburb]);
                setSuburbInput('');
                setFilteredSuburbs([]);
            };

            const removeSuburb = (suburbString) => {
                setSelectedSuburbs(prev => prev.filter(s => `${s.s} ${s.p}` !== suburbString));
            };

            // ACPR Filtering and Sorting Logic
            const filteredAcprs = useMemo(() => {
                let data = ALL_ACPRS;
                if (acprSearch) {
                    const lower = acprSearch.toLowerCase();
                    data = data.filter(item => 
                        item.label.toLowerCase().includes(lower) || 
                        item.state.toLowerCase().includes(lower)
                    );
                }
                // Sort alphabetically by Label
                return [...data].sort((a, b) => a.label.localeCompare(b.label));
            }, [acprSearch]);

            // Search logic
            useEffect(() => {
                if (suburbInput.length < 2) {
                    setFilteredSuburbs([]);
                    return;
                }
                const term = suburbInput.toLowerCase();
                const results = EXTENDED_SUBURBS.filter(s => 
                    s.s.toLowerCase().includes(term) || s.p.startsWith(term)
                );
                // Limit results for performance in dropdown
                setFilteredSuburbs(results.slice(0, 100));
            }, [suburbInput]);


            // --- Derived State for UI ---
            const partialStates = useMemo(() => {
                const states = new Set();
                selectedAcprs.forEach(a => states.add(a.state));
                selectedSuburbs.forEach(s => states.add(s.st));
                return states;
            }, [selectedAcprs, selectedSuburbs]);

            const handleNationwideChange = () => {
                setIsNationwide(!isNationwide);
                if (!isNationwide) {
                    setSelectedStates([]);
                    setSelectedAcprs([]);
                    setSelectedSuburbs([]);
                }
            };

            return (
                <div className="max-w-4xl mx-auto p-6 bg-slate-50 min-h-screen font-sans text-slate-900">
                    
                    <div className="bg-white rounded-xl shadow-sm border border-slate-300 overflow-hidden">

                                    Nationwide (All Australia)

                                <button 
                                    onClick={handleNationwideChange}
                                    className={`relative inline-flex h-6 w-11 items-center rounded-full transition-colors focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 ${isNationwide ? 'bg-blue-600' : 'bg-slate-300'}`}
                                >
                                    <span className={`inline-block h-4 w-4 transform rounded-full bg-white transition-transform ${isNationwide ? 'translate-x-6' : 'translate-x-1'}`} />
                                </button>
                            </div>
                        </div>

                        {/* Main Interface Body */}
                        <div className={`p-6 grid grid-cols-1 md:grid-cols-12 gap-6 relative transition-opacity duration-200 ${isNationwide ? 'opacity-50 pointer-events-none select-none' : 'opacity-100'}`}>
                            
                            {/* Column 1: States */}
                            <div className="md:col-span-3 border-r border-slate-300 pr-4">
                                <h3 className="text-xs font-bold text-slate-600 mb-3 flex items-center gap-2">
                                    <MapIcon size={14} /> 1. State / Territory
                                </h3>
                                <div className="space-y-2">
                                    {MOCK_STATES.map(state => {
                                        const isSelected = selectedStates.includes(state.code);
                                        const isPartial = !isSelected && partialStates.has(state.code);
                                        
                                        return (
                                            <div key={state.code} className="flex items-center">
                                                <button
                                                    onClick={() => toggleState(state.code)}
                                                    className={`w-full flex items-center justify-between p-2 rounded text-left text-sm transition-colors ${
                                                        isSelected 
                                                            ? 'bg-blue-50 text-blue-800 border border-blue-300' 
                                                            : 'hover:bg-slate-50 border border-transparent'
                                                    }`}
                                                >
                                                    <span className="flex items-center gap-2 text-slate-800">
                                                        <div className={`w-4 h-4 rounded border flex items-center justify-center ${
                                                            isSelected ? 'bg-blue-600 border-blue-600' : 'border-slate-400 bg-white'
                                                        }`}>
                                                            {isSelected && <Check size={10} className="text-white" />}
                                                            {isPartial && !isSelected && <div className="w-2 h-0.5 bg-blue-500" />}

                                                </div>

                                            <button
                                                key={acpr.id}
                                                onClick={() => toggleAcpr(acpr)}
                                                className={`w-full text-left p-2 border-b border-slate-200 text-sm flex items-center justify-between hover:bg-slate-50 ${isSelected ? 'bg-indigo-50 text-indigo-800' : 'text-slate-800'}`}
                                            >
                                                <span>{acpr.label} <span className="text-slate-500 ml-1">({acpr.state})</span></span>
                                                {isSelected && <Check size={14} className="text-indigo-600" />}
                                            </button>
                                        );
                                    })}
                                    {filteredAcprs.length === 0 && (
                                        <div className="p-4 text-center text-sm text-slate-500 italic">
                                            No regions found matching "{acprSearch}"
                                        </div>
                                    )}
                                </div>
                                <p className="text-xs text-slate-500 mt-2">Selection includes all suburbs within region.</p>
                            </div>

                            {/* Column 3: Suburbs/Postcodes */}
                            <div className="md:col-span-5 pl-4">
                                <h3 className="text-xs font-bold text-slate-600 mb-3 flex items-center gap-2">
                                    <MapPin size={14} /> 3. Suburb / Postcode
                                </h3>
                                
                                <div className="relative">
                                    <input 
                                        type="text" 
                                        placeholder="Search Suburb or Postcode..." 
                                        className="w-full border border-slate-400 rounded-md px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none text-slate-800 placeholder-slate-500"
                                        value={suburbInput}
                                        onChange={(e) => setSuburbInput(e.target.value)}
                                    />
                                    
                                    {/* Autocomplete Dropdown */}
                                    {(filteredSuburbs.length > 0 || (suburbInput.length >= 2 && filteredSuburbs.length === 0)) && (
                                        <div className="absolute top-full left-0 right-0 mt-1 bg-white border border-slate-300 rounded-md shadow-lg z-10 max-h-60 overflow-y-auto">
                                            {filteredSuburbs.length === 0 ? (
                                                <div className="px-3 py-2 text-sm text-slate-500 italic">No results found in test database</div>
                                            ) : (
                                                filteredSuburbs.map((sub, idx) => {
                                                    const isParentStateSelected = selectedStates.includes(sub.st);
                                                    return (
                                                        <button 
                                                            key={`${sub.p}-${sub.s}-${idx}`}
                                                            disabled={isParentStateSelected}
                                                            onClick={() => addSuburb(sub)}
                                                            className={`w-full text-left px-3 py-2 text-sm hover:bg-slate-50 border-b border-slate-200 last:border-0 flex justify-between ${isParentStateSelected ? 'opacity-50 cursor-not-allowed bg-slate-50 text-slate-500' : 'text-slate-800'}`}
                                                        >
                                                            <span>{sub.s}, {sub.st} {sub.p}</span>
                                                            {isParentStateSelected && <span className="text-xs text-slate-500">Included in State</span>}
                                                        </button>
                                                    )
                                                })
                                            )}
                                        </div>
                                    )}
                                </div>

                                <div className="mt-4 max-h-[260px] overflow-y-auto pr-2">
                                    {/* Suburb List Display */}
                                    {selectedSuburbs.length === 0 && (
                                        <div className="text-sm text-slate-500 text-center py-8 border-2 border-dashed border-slate-300 rounded-lg flex flex-col items-center gap-2">
                                            <Database size={24} className="text-slate-400" />
                                            <span>No individual suburbs selected.</span>
                                            <span className="text-xs text-slate-400">Test DB contains ~350 suburbs</span>
                                        </div>
                                    )}
                                    <div className="flex flex-wrap gap-2">
                                        {selectedSuburbs.map((s, idx) => (
                                            <span key={`${s.s}-${s.p}`} className="inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-xs font-medium bg-white border border-slate-400 text-slate-800 shadow-sm">
                                                {s.s} {s.p}
                                                <button onClick={() => removeSuburb(`${s.s} ${s.p}`)} className="text-slate-500 hover:text-red-600 transition-colors">
                                                    <X size={12} />
                                                </button>
                                            </span>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        </div>

                        {/* Footer / Results Summary */}
                        <div className="bg-slate-800 text-slate-200 p-6">
                            <h3 className="text-xs font-bold text-slate-400 mb-4">Final Selection Output</h3>
                            
                            <div className="bg-slate-900 rounded-lg p-4 border border-slate-600 min-h-[100px]">
                                {isNationwide ? (
                                    <div className="flex items-center justify-between gap-3 text-green-400 font-medium p-2 bg-slate-800/50 rounded border border-green-900">
                                        <div className="flex items-center gap-2">
                                            <Globe size={20} />
                                            <span>Nationwide (All States, Territories, and Regions included)</span>
                                        </div>
                                        <button onClick={handleNationwideChange} className="hover:text-white transition-colors">
                                            <X size={16} />
                                        </button>
                                    </div>
                                ) : (selectedStates.length === 0 && selectedAcprs.length === 0 && selectedSuburbs.length === 0) ? (
                                    <span className="text-slate-500 italic">No selection criteria defined.</span>
                                ) : (
                                    <div className="space-y-4">
                                        
                                        {/* 1. Full States */}
                                        {selectedStates.length > 0 && (
                                            <div>
                                                <span className="text-slate-400 text-xs block mb-1">States / Territories (Full Coverage):</span>
                                                <div className="flex flex-wrap gap-2">
                                                    {selectedStates.map(code => (
                                                        <span key={code} className="bg-blue-900 text-blue-100 border border-blue-600 px-3 py-1 rounded text-sm font-medium flex items-center gap-2">
                                                            {MOCK_STATES.find(s => s.code === code)?.label}
                                                            <button onClick={() => toggleState(code)} className="hover:text-white text-blue-300 transition-colors">
                                                                <X size={14} />
                                                            </button>
                                                        </span>
                                                    ))}
                                                </div>
                                            </div>
                                        )}

                                        {/* 2. ACPRs */}
                                        {selectedAcprs.length > 0 && (
                                            <div>
                                                <span className="text-slate-400 text-xs block mb-1">Aged Care Planning Regions:</span>
                                                <div className="flex flex-wrap gap-2">
                                                    {selectedAcprs.map(acpr => (
                                                        <span key={acpr.id} className="bg-indigo-900 text-indigo-100 border border-indigo-600 px-3 py-1 rounded text-sm font-medium flex items-center gap-2">
                                                            {acpr.label} ({acpr.state})
                                                            <button onClick={() => toggleAcpr(acpr)} className="hover:text-white text-indigo-300 transition-colors">
                                                                <X size={14} />
                                                            </button>
                                                        </span>
                                                    ))}
                                                </div>
                                            </div>
                                        )}

                                        {/* 3. Suburbs */}
                                        {selectedSuburbs.length > 0 && (
                                            <div>
                                                <span className="text-slate-400 text-xs block mb-1">Individual Locations:</span>
                                                <div className="flex flex-wrap gap-2">
                                                    {selectedSuburbs.map((sub, idx) => (
                                                        <span key={idx} className="bg-slate-700 text-slate-100 border border-slate-500 px-3 py-1 rounded text-sm font-medium flex items-center gap-2">
                                                            {sub.s}, {sub.st} {sub.p}
                                                            <button onClick={() => removeSuburb(`${sub.s} ${sub.p}`)} className="hover:text-white text-slate-400 transition-colors">
                                                                <X size={14} />
                                                            </button>
                                                        </span>
                                                    ))}
                                                </div>
                                            </div>
                                        )}

                                    </div>
                                )}
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<RegionalSelector />);
    </script>
</body>
</html>
